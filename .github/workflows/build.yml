name: SoundWave CI/CD

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master, production ]

jobs:
  test:
    name: Run Tests and Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      # - name: Verify formatting
      #   run: dart format --set-exit-if-changed .
      # - name: Analyze project
      #   run: flutter analyze
      # - name: Run tests
      #   run: flutter test

  build-android:
    name: Build Android APK
    needs: test
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soundwave-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS Unsigned IPA
    needs: test
    if: github.ref == 'refs/heads/production'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign
      - name: Create Unsigned IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload
          zip -r SoundWave-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: soundwave-ipa
          path: SoundWave-unsigned.ipa

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: soundwave-apk
          path: release-artifacts

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: soundwave-ipa
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "SoundWave Auto-Release (Build ${{ github.run_number }})"
          body: "🚀 Auto-generated release from the `production` branch."
          draft: false
          prerelease: false
          files: |
            release-artifacts/app-release.apk
            release-artifacts/SoundWave-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
