        }

<!-- The Shell Hierarchy Filter: TopAppBar and BottomNavBar suppressed for Login focused journey -->
<main class="w-full max-w-md relative">
<!-- Brand Identity Container -->
<div class="text-center mb-12">
<div class="inline-flex items-center justify-center mb-6">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center neon-glow">
<span class="material-symbols-outlined text-on-primary-container text-4xl" data-icon="graphic_eq">graphic_eq</span>
</div>
</div>
<h1 class="font-headline font-extrabold text-3xl tracking-tighter text-on-background uppercase mb-2">
                OBSIDIAN RHYTHM
            </h1>
<p class="font-body text-on-surface-variant text-sm tracking-wide">
                Experience the Digital Curator
            </p>
</div>
<!-- Glassmorphism Login Card -->
<div class="glass-panel rounded-3xl p-8 shadow-2xl relative overflow-hidden">
<div class="relative z-10">
<div class="mb-10">
<h2 class="font-headline font-bold text-2xl mb-1 text-on-surface">Welcome back</h2>
<p class="text-on-surface-variant text-sm">Please enter your details to continue</p>
</div>
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="block font-label text-[10px] font-bold uppercase tracking-widest text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-low border-none rounded-2xl py-4 pl-12 pr-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/50 transition-all" id="email" placeholder="curator@rhythm.io" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block font-label text-[10px] font-bold uppercase tracking-widest text-on-surface-variant" for="password">Password</label>
<a class="text-[10px] font-bold uppercase tracking-widest text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-xl" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-low border-none rounded-2xl py-4 pl-12 pr-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/50 transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary-container font-headline font-bold py-4 rounded-full neon-glow hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Log In
                        <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-8">
<div class="h-[1px] flex-1 bg-outline-variant opacity-30"></div>
<span class="font-label text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">OR</span>
<div class="h-[1px] flex-1 bg-outline-variant opacity-30"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 bg-surface-variant/40 hover:bg-surface-variant/60 py-3.5 px-4 rounded-2xl transition-all group">
<img alt="Google Logo" class="w-5 h-5 grayscale group-hover:grayscale-0 transition-all" data-alt="Official Google G logo in its brand colors on a transparent background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCQdA-7UrAVbpSccLMACZfnu2FjP1YNnP1j8xeYmVXW5nPAcvVtzTpURCCCit5vGFa3OeaQi0w4tebzH52tfcR4aXz9Fr4RoKT9bCkaHlRZu1xQyR345bKQkHKDIHzDmqVyq6Zb9XRmrfhrJrkDhyOOQbuLHzibRUAZKR9usmL0xWi3WOPrQjLVW3tYKZUzKGmLsOxSGNB_eq3eLLuz9pjrCHTU8eRCe1Cz_E9qrpumRTaGQb2nS6yQEY7MV02_qF-IN1XHsI8wtJA"/>
<span class="text-sm font-semibold text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-3 bg-surface-variant/40 hover:bg-surface-variant/60 py-3.5 px-4 rounded-2xl transition-all group">
<span class="material-symbols-outlined text-on-surface text-xl" data-icon="apple" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="text-sm font-semibold text-on-surface">Apple</span>
</button>
</div>
</div>
<!-- Background subtle artistic touch -->
<div class="absolute -bottom-12 -right-12 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -top-12 -left-12 w-48 h-48 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
</div>
<!-- Footnote -->
<div class="mt-8 text-center">
<p class="text-on-surface-variant text-sm">
                Don't have an account? 
                <a class="text-primary font-bold hover:underline underline-offset-4 ml-1" href="#">Sign Up</a>
</p>
</div>
</main>
<!-- Decorative Corner Elements -->
<div class="fixed top-12 left-12 hidden lg:block">
<div class="w-32 h-32 rounded-xl border border-primary/10 rotate-12 opacity-20"></div>
